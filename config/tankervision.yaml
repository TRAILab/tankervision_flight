# tankervision.yaml — System Configuration for Each Flight Computer.

#hardware_trigger: false | true | on_pps

notifications:
  email_to: wildfire@robotics.utias.utoronto.ca
  gmail_user: wildfire@robotics.utias.utoronto.ca
  gmail_app_password: aqszpdqdypwqrkre
  
# set manage to true to turn on/off with takeoff landing
# TO-DO: confirm implementation when cellular is on. use nmcli device status
cellular: 
  manage: false 
  interface: wwan0
  takeoff_delay_sec: 300 

storage:
  root: /mnt/storage
  saved_frames_dir: /mnt/storage/saved_frames

trigger:
  topic: /save_images_trigger
  timeout_sec: 20
  cooldown_sec: 3

lucid_camera:
  topic: /cam0/image_raw
  width: 5320
  height: 4600
  hardware_trigger: on_pps
  pixelformat: bayer_rggb16
  qos_reliability: reliable

analog_camera:
  topic: /cam1/image_raw
  device: /dev/video0
  standard: NTSC
  ntsc:
    image_size: [720, 480]
    time_per_frame: [1001, 30000]
  pal:
    image_size: [720, 576]
    time_per_frame: [1, 25]

yolo:
  model: src/tanker_vision/tanker_vision/fire_detection.pt
  fire_class: 2
  confidence: 0.3
 
ptp:
  interface: auto
  require_sync_before_launch: true